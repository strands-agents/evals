name: Auto Strands Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  authorization-check:
    name: Check access
    permissions: read-all
    runs-on: ubuntu-latest
    outputs:
      approval-env: ${{ steps.auth.outputs.approval-env }}
    steps:
      - name: Check Authorization
        id: auth
        uses: strands-agents/devtools/authorization-check@main
        with:
          skip-check: false
          username: ${{ github.event.pull_request.user.login || 'invalid' }}
          allowed-roles: 'triage,write,admin'

  trigger-review:
    name: Trigger Strands Review
    needs: authorization-check
    environment: ${{ needs.authorization-check.outputs.approval-env }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Strands Command Workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Pass the exact commit this pull_request event fired on so the
            // dispatched run acts on that commit instead of re-resolving the
            // branch later. A later push just fires another event (a new run for
            // the new commit).
            const pr = context.payload.pull_request;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'strands-command.yml',
              ref: 'main',
              inputs: {
                issue_id: String(pr.number),
                command: 'review',
                session_id: '',
                head_sha: pr.head.sha,
                head_repo: pr.head.repo.full_name,
                head_ref: pr.head.ref
              }
            });
            console.log(`Triggered /strands review for PR #${context.payload.pull_request.number}`);
